<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统登录</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d0f17;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* 背景渐变光晕氛围 */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(140px);
            z-index: 0;
            opacity: 0.45;
            pointer-events: none;
        }
        body::before {
            background: #ff007f;
            top: 15%;
            left: 20%;
        }
        body::after {
            background: #00f2fe;
            bottom: 15%;
            right: 20%;
        }

        /* 登录框外层流光边框包装 */
        .login-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            padding: 2px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.1);
            transition: all 0.4s ease;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .login-wrapper:hover {
            background: linear-gradient(135deg, #ff007f, #7928ca, #00f2fe);
            box-shadow: 0 10px 40px rgba(0, 242, 254, 0.3), 0 0 20px rgba(255, 0, 127, 0.3);
        }

        /* 登录主体（玻璃拟态） */
        .login-card {
            background: rgba(20, 24, 38, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 22px;
            padding: 40px 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 标题 logo 区域 */
        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .avatar-icon {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            background: linear-gradient(135deg, #00f2fe, #7928ca);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            margin: 0 auto 16px;
            box-shadow: 0 8px 20px rgba(0, 242, 254, 0.3);
        }

        .login-header h2 {
            color: #fff;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .login-header p {
            color: #a0aec0;
            font-size: 0.85rem;
        }

        /* 表单样式 */
        .login-form {
            width: 100%;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-group label {
            display: block;
            color: #a0aec0;
            font-size: 0.85rem;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: #00f2fe;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.3);
        }

        /* 登录按钮 */
        .login-btn {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background: linear-gradient(135deg, #00f2fe, #7928ca);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
            transition: all 0.3s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.5);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        /* 提示说明 */
        .login-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 0.8rem;
            color: #a0aec0;
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="avatar-icon">⚡</div>
                <h2>欢迎回来</h2>
                <p>请输入凭据以访问专属导航</p>
            </div>

            <form class="login-form" id="loginForm">
                <div class="input-group">
                    <label>账号 / 用户名</label>
                    <input type="text" id="username" placeholder="请输入账号" required autocomplete="off">
                </div>

                <div class="input-group">
                    <label>密码</label>
                    <input type="password" id="password" placeholder="请输入密码" required>
                </div>

                <button type="submit" class="login-btn">即刻登录 →</button>
            </form>

            <div class="login-footer">
                极客导航系统 · 安全访问中
            </div>
        </div>
    </div>

    <script>
        // 设置自定义的账号与密码
        const CORRECT_USER = "myy666";  // 修改你的预设账号
        const CORRECT_PASS = "Myy20041028@"; // 修改你的预设密码

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); 

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (username === CORRECT_USER && password === CORRECT_PASS) {
                // 校验成功，跳转至 myy.html
                window.location.href = './myy.html';
            } else {
                // 校验失败，弹窗提醒并重置密码框
                alert("账号或密码错误，请重新输入！");
                document.getElementById('password').value = "";
            }
        });
    </script>
</body>
</html>
