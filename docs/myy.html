<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>炫彩卡片导航（云端同步版）</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d0f17;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* 背景氛围光 */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 0;
            opacity: 0.4;
            pointer-events: none;
        }
        body::before { background: #ff007f; top: 10%; left: 15%; }
        body::after { background: #00f2fe; bottom: 10%; right: 15%; }

        /* 顶部操作区 */
        .top-bar {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .page-title {
            color: #fff;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #00f2fe, #4facfe, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 添加卡片按钮 */
        .add-btn {
            background: linear-gradient(135deg, #ff007f, #7928ca);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 0, 127, 0.6);
        }

        /* 核心网格容器 */
        .card-container {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1100px;
        }

        /* 卡片外层包装（渐变边框） */
        .card-wrapper {
            position: relative;
            border-radius: 20px;
            padding: 2px;
            background: rgba(255, 255, 255, 0.08);
            transition: all 0.4s ease;
        }

        .card-wrapper:hover {
            background: linear-gradient(135deg, #ff007f, #7928ca, #00f2fe);
            box-shadow: 0 10px 30px rgba(0, 242, 254, 0.25), 0 0 20px rgba(255, 0, 127, 0.25);
            transform: translateY(-8px) scale(1.02);
        }

        /* 卡片主体 */
        .card {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            padding: 24px;
            background: rgba(20, 24, 38, 0.8);
            backdrop-filter: blur(16px);
            border-radius: 18px;
            text-decoration: none;
            color: #fff;
            position: relative;
        }

        /* 卡片右上角操作按钮组 */
        .card-actions {
            position: absolute;
            top: 12px;
            right: 12px;
            display: flex;
            gap: 6px;
            z-index: 2;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #a0aec0;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            transition: all 0.2s ease;
        }

        .action-btn.edit-btn:hover {
            background: #00f2fe;
            color: #000;
        }

        .action-btn.delete-btn:hover {
            background: #ff4757;
            color: #fff;
        }

        /* 头部：图标与名称 */
        .card-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
        }

        .card-icon {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, var(--start-color), var(--end-color));
            box-shadow: 0 4px 15px var(--shadow-color);
            flex-shrink: 0;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 110px;
        }

        .card-desc {
            font-size: 0.88rem;
            color: #a0aec0;
            line-height: 1.5;
            margin-bottom: 20px;
            min-height: 40px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-footer {
            display: flex;
            align-items: center;
            font-size: 0.85rem;
            font-weight: 600;
            color: #00f2fe;
            transition: gap 0.3s ease;
        }

        .card-wrapper:hover .card-footer {
            gap: 8px;
            color: #ff007f;
        }

        /* 弹窗遮罩 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* 弹窗表单 */
        .modal {
            background: #141826;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal {
            transform: translateY(0);
        }

        .modal h2 {
            color: #fff;
            margin-bottom: 20px;
            font-size: 1.3rem;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            color: #a0aec0;
            font-size: 0.85rem;
            margin-bottom: 6px;
        }

        .input-group input, .input-group textarea {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus, .input-group textarea:focus {
            border-color: #00f2fe;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .btn-submit {
            flex: 1;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            color: #000;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-cancel {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <h1 class="page-title">极客导航</h1>
        <button class="add-btn" id="openModalBtn">＋ 添加网站</button>
    </div>

    <div class="card-container" id="cardContainer">
        <!-- 卡片通过 JavaScript 动态渲染 -->
    </div>

    <!-- 添加/编辑卡片弹窗 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2 id="modalTitle">添加新卡片</h2>
            <form id="cardForm">
                <input type="hidden" id="cardId"> <!-- 隐藏域：标识是否是编辑状态 -->
                <div class="input-group">
                    <label>网站名称</label>
                    <input type="text" id="siteName" placeholder="例如：百度" required>
                </div>
                <div class="input-group">
                    <label>网站网址 (URL)</label>
                    <input type="url" id="siteUrl" placeholder="https://www.baidu.com" required>
                </div>
                <div class="input-group">
                    <label>网站描述</label>
                    <textarea id="siteDesc" rows="2" placeholder="简单描述一下网站..."></textarea>
                </div>
                <div class="modal-buttons">
                    <button type="button" class="btn-cancel" id="closeModalBtn">取消</button>
                    <button type="submit" class="btn-submit" id="submitBtn">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 1. 云端配置信息
        const BIN_ID = '6a8703d5f5f4af5e292d2770'; // ⚠️【必填】粘贴你在 JSONBin 获取到的 Bin ID
        const API_KEY = '$2a$10$kbEA4RHQdehoXWzi4Lr8oeQ6v/tGaV6.fjG.J.eRaE8bcX0rAZEW6';
        const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

        // 预设色彩组合
        const colorPalettes = [
            { start: '#ff4e50', end: '#f9d423', shadow: 'rgba(255, 78, 80, 0.4)' },
            { start: '#f857a6', end: '#ff5858', shadow: 'rgba(248, 87, 166, 0.4)' },
            { start: '#00c6ff', end: '#0072ff', shadow: 'rgba(0, 198, 255, 0.4)' },
            { start: '#7928ca', end: '#ff0080', shadow: 'rgba(121, 40, 202, 0.4)' },
            { start: '#11998e', end: '#38ef7d', shadow: 'rgba(17, 153, 142, 0.4)' },
            { start: '#ff0844', end: '#ffb199', shadow: 'rgba(255, 8, 68, 0.4)' }
        ];

        // 本地卡片数据数组
        let cards = [];

        const cardContainer = document.getElementById('cardContainer');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalTitle = document.getElementById('modalTitle');
        const openModalBtn = document.getElementById('openModalBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const cardForm = document.getElementById('cardForm');
        const submitBtn = document.getElementById('submitBtn');
        
        const cardIdInput = document.getElementById('cardId');
        const siteNameInput = document.getElementById('siteName');
        const siteUrlInput = document.getElementById('siteUrl');
        const siteDescInput = document.getElementById('siteDesc');

        // 从云端读取数据
        async function loadCardsFromCloud() {
            cardContainer.innerHTML = '<div style="color:#a0aec0; text-align:center; grid-column: 1/-1; padding: 40px 0;">☁️ 正在从云端同步卡片数据...</div>';
            try {
                const res = await fetch(`${API_URL}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                if (!res.ok) throw new Error('网络请求错误');
                const data = await res.json();
                cards = data.record || [];
                renderCards();
            } catch (err) {
                cardContainer.innerHTML = '<div style="color:#ff4757; text-align:center; grid-column: 1/-1;">⚠️ 云端同步失败，请检查 Bin ID 与网络！</div>';
            }
        }

        // 保存数据到云端
        async function saveCardsToCloud() {
            try {
                await fetch(API_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY
                    },
                    body: JSON.stringify(cards)
                });
            } catch (err) {
                alert('云端同步失败，请重试！');
            }
        }

        // 渲染所有卡片
        function renderCards() {
            cardContainer.innerHTML = '';
            if (cards.length === 0) {
                cardContainer.innerHTML = '<div style="color:#a0aec0; text-align:center; grid-column: 1/-1; padding: 40px 0;">暂无收藏网站，点击右上角添加吧！</div>';
                return;
            }

            cards.forEach(card => {
                const wrapper = document.createElement('div');
                wrapper.className = 'card-wrapper';

                const firstChar = card.name.trim().charAt(0).toUpperCase();

                wrapper.innerHTML = `
                    <a href="${card.url}" target="_blank" class="card">
                        <div class="card-actions">
                            <button class="action-btn edit-btn" onclick="openEditModal(event, ${card.id})" title="编辑卡片">✎</button>
                            <button class="action-btn delete-btn" onclick="deleteCard(event, ${card.id})" title="删除卡片">✕</button>
                        </div>
                        <div>
                            <div class="card-header">
                                <div class="card-icon" style="--start-color: ${card.palette.start}; --end-color: ${card.palette.end}; --shadow-color: ${card.palette.shadow};">
                                    ${firstChar}
                                </div>
                                <div class="card-title">${card.name}</div>
                            </div>
                            <p class="card-desc">${card.desc || '暂无描述'}</p>
                        </div>
                        <div class="card-footer">进入网站 <span>→</span></div>
                    </a>
                `;
                cardContainer.appendChild(wrapper);
            });
        }

        // 打开“添加”弹窗
        openModalBtn.addEventListener('click', () => {
            modalTitle.innerText = '添加新卡片';
            cardIdInput.value = '';
            cardForm.reset();
            modalOverlay.classList.add('active');
        });

        // 打开“编辑”弹窗并回显数据
        function openEditModal(event, id) {
            event.preventDefault();
            event.stopPropagation();
            
            const card = cards.find(c => c.id === id);
            if (!card) return;

            modalTitle.innerText = '编辑卡片';
            cardIdInput.value = card.id;
            siteNameInput.value = card.name;
            siteUrlInput.value = card.url;
            siteDescInput.value = card.desc || '';

            modalOverlay.classList.add('active');
        }

        // 删除卡片
        async function deleteCard(event, id) {
            event.preventDefault();
            event.stopPropagation();
            if (confirm('确定要删除这个网站卡片吗？')) {
                cards = cards.filter(card => card.id !== id);
                renderCards();
                await saveCardsToCloud(); // 同步到云端
            }
        }

        // 关闭弹窗
        closeModalBtn.addEventListener('click', () => modalOverlay.classList.remove('active'));
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) modalOverlay.classList.remove('active');
        });

        // 提交表单（处理新增或编辑）
        cardForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const id = cardIdInput.value;
            const name = siteNameInput.value;
            let url = siteUrlInput.value;
            const desc = siteDescInput.value;

            if (!/^https?:\/\//i.test(url)) {
                url = 'https://' + url;
            }

            if (id) {
                // 编辑已存在的卡片
                const card = cards.find(c => c.id == id);
                if (card) {
                    card.name = name;
                    card.url = url;
                    card.desc = desc;
                }
            } else {
                // 添加新卡片
                const randomPalette = colorPalettes[Math.floor(Math.random() * colorPalettes.length)];
                cards.push({
                    id: Date.now(),
                    name,
                    url,
                    desc,
                    palette: randomPalette
                });
            }

            renderCards();
            cardForm.reset();
            modalOverlay.classList.remove('active');

            // 禁用保存按钮，提示同步中
            submitBtn.innerText = '保存中...';
            await saveCardsToCloud(); // 写入云端
            submitBtn.innerText = '保存';
        });

        // 页面初始化：拉取云端数据
        loadCardsFromCloud();
    </script>
</body>
</html>
